<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#E86A92" id="meta-theme" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="彩虹" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <title>彩虹 · 恋爱纪念册</title>
</head>
<body>
  <div id="app">
    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view"></main>
    <nav class="tabbar" id="tabbar"></nav>
  </div>
  <!-- 首屏加载层：HTML 解析即显示，避免白屏；首次视图渲染完成后由 app.js 淡出 -->
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-inner">
      <div class="spinner"></div>
      <p class="boot-text">正在加载…</p>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
